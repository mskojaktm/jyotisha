<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест на определение доши (Викрити)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6ef;--card:#fff;--tx:#2b2620;--mu:#7a7064;--bd:#e4dccd;--ac:#9a5b2e;--v:#4f7fb0;--p:#c8553d;--k:#5b9a6b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--card:#27231e;--tx:#efe8dc;--mu:#a69c8d;--bd:#3d372f;--ac:#e0a070;--v:#7aa6d6;--p:#e5806a;--k:#7fc08f}}
:root[data-theme="dark"]{--bg:#1d1a16;--card:#27231e;--tx:#efe8dc;--mu:#a69c8d;--bd:#3d372f;--ac:#e0a070;--v:#7aa6d6;--p:#e5806a;--k:#7fc08f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:1.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin:14px 0}
.mu{color:var(--mu);font-size:.92rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:10px 18px}
button.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);padding:12px 14px}
.opt.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.row{margin:12px 0}.row b{display:flex;justify-content:space-between}
.track{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}.track i{display:block;height:100%}
.note{border-left:3px solid var(--ac);padding:4px 12px;margin:14px 0;color:var(--mu);font-size:.92rem}
ul{padding-left:20px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[
["Строение тела","Худощавое","Среднее","Плотное, коренастое"],
["Вес на сегодняшний момент","Недостаточный, сложно набрать вес (даже при питании и спорте)","Средний: нет проблем ни с набором, ни со сбросом","Избыточный: вес набирается легко, сбросить трудно"],
["Живот","Худой и плоский всегда","Средний","Большой, обвисающий"],
["Суставы","Выступающие, узловатые, сухие, склонные к хрусту","Пропорциональные","Большие, хорошо сформированные, двигаются легко, хруста нет"],
["Бёдра","Стройные, тонкие","Средние","Тяжёлые и большие"],
["Шея","Тонкая, очень длинная или очень короткая","Средняя","Плотная, твёрдая, объёмная"],
["Загар","Плохо загорает, с трудом","Быстро обгорает на солнце","Умеренно, ровный хороший загар"],
["Кожа (в обычном расслабленном состоянии)","Тонкая, сухая или склонная к сухости","Мягкая, горячая, очень быстро краснеет","Плотная, мягкая, прохладная"],
["Вены","Выступающие, близко к тонкой коже (склонность к варикозу)","Проступают под кожей","Никогда не выступают, под толстой кожей"],
["Мускулатура","Трудно нарастить мышцы даже при долгих тренировках","Крепкие, хорошо развитые мышцы","Объёмные, твёрдые, хорошо развитые мышцы"],
["Волосы на голове","Тонкие, волнистые/вьющиеся, сухие, секущиеся, склонны к перхоти","Мягкие, тонкие, склонность к ранней седине и облысению","Густые, плотные, маслянистые, крепкие"],
["Волосы на теле","Жёсткие, кучерявые","Светлые, тонкие","Крупные, густые"],
["Губы (натуральные)","Тонкие, узкие, разной ширины, часто трескаются","Ровные, красные, часто воспаляются, склонны к высыпаниям","Наполненные, большие, ровные, часто влажные"],
["Зубы","Неодинаковые, неровные, выступающие, проблемы с эмалью","Ровные, среднего размера, часто желтоватые","Белые, ровные, большие и крепкие"],
["Кисти рук","Маленькие, сухие, холодные, шершавые","Средние, тёплые, с розовым оттенком","Большие, влажные, прохладные, плотные"],
["Позвоночник","Склонность к сколиозу, хрусту, быстрому разрушению костной ткани","Склонность к кифозу","Склонность к лордозу, очень крепкий, медленно разрушается"],
["Ногти (натуральные)","Истончённые, ломкие, грубые, с заусенцами","Правильной формы, мягкие, но прочные","Плотные, толстые, прочные"],
["Моча","Скудная, бесцветная, мочеиспускание может быть затруднено","Обильная, ярко-жёлтая или слегка красноватая","Мутная, беловатая"],
["Стул","Скудный, сухой, с газами, склонность к запорам","Мягкий, часто несформированный, 2 и более раз в день","Обильный, регулярный, стабильный"],
["Потовыделение","Минимальное, почти без запаха","Обильное (особенно в жару), с резким запахом","Умеренное, постоянное, умеренный запах"],
["Аппетит","Непостоянный, нужны частые перекусы","Сильный, нестерпимый (голодный — становлюсь злым)","Слабый, но постоянный; легко пропускаю приём пищи"],
["Предпочтения в перекусах","Хрустящее (сухарики, чипсы)","Холодное: мороженое, холодные напитки","Сладкое, кремообразное"],
["Пищеварение","Нерегулярное, склонность к вздутию и газам","Сильное, быстрое","Медленное, но очень устойчивое"],
["Жажда","Непостоянная","Избыточная, пью очень много жидкости","Редкая, пью мало воды"],
["Умственная активность","Быстро воспринимаю, легко адаптируюсь и меняюсь","Критическая, принципиальная, настроена на победу и результат","Медленная, терпимая, миролюбивая"],
["Характер","Изменчивый","Самоуверенный, амбициозный","Терпимый, привязчивый, спокойный"],
["Принятие решений","Молниеносное, часто не думая","Быстрое, правильное, основано на анализе и опыте","Медленное, долго обдуманное, но стабильное"],
["Память","Плохая, нерегулярная: быстро запоминаю и быстро забываю","Хорошая, острая, ясная","Долгая: запоминаю долго, но помню все детали всю жизнь"],
["Эмоциональные тенденции","Переменчивость, страхи, тревожность, чувство одиночества","Гнев, раздражительность, склонность спорить","Сентиментальность, грусть, склонность к депрессии"],
["Отношение к обидам","Быстро прощаю, легко отпускаю","Прощаю только после искренних извинений","Прощаю с трудом или не прощаю, помню обиды годами"],
["Сон","Прерывистый, поверхностный, склонность к бессоннице","Нормальный, но нарушается из-за перегрева или гнева","Глубокий, долгий, крепкий, склонность к храпу"],
["Чувствительность","К шуму, холоду, сквознякам и боли","К жаре и яркому свету","К прохладе, прикосновениям, эмоциональным проявлениям"],
["Интересы","Путешествия, искусство, развлечения","Спорт, политика, соревнования, активная деятельность","Покой, природа, кулинария, садоводство, стабильный бизнес"],
["Сексуальность","Нерегулярное влечение, много фантазий, быстро устаю","Сильное, страстное, регулярное влечение","Спокойное влечение, но высокая и устойчивая внутренняя энергия"],
["Иммунитет","Пониженный или изменчивый","Средний, склонность к воспалительным процессам","Сильный, крепкий; склонность к застойным явлениям и отёкам"],
["Финансы","Быстро зарабатываю и быстро трачу на мелочи","Трачу на роскошь, удовольствия и демонстрацию статуса","Разумно трачу, умею копить и экономить"]
];
var D=[
{n:"Вата",c:"--v",
 d:"В последние 2–3 года у вас преобладают качества Ваты: сухость, холод, лёгкость, изменчивость. Тело склонно к дисбалансу именно этого типа: сухость кожи и волос, непостоянный аппетит и пищеварение, нерегулярный сон, тревожность и переменчивость настроения.",
 r:["Избегайте сухой, холодной и сырой пищи (сыроедение, сухофрукты): она ещё больше увеличивает Вату.","Отдавайте предпочтение маслянистым, тёплым, приготовленным блюдам со специями (например, фенхель, кориандр).","Соблюдайте чёткий режим дня.","Полезно тёплое молоко."]},
{n:"Питта",c:"--p",
 d:"В последние 2–3 года у вас преобладают качества Питты: жар, острота, интенсивность. Тело склонно к перегреву: быстрое покраснение и воспаления кожи, сильный аппетит и быстрое пищеварение, раздражительность и гнев, особенно если вы голодны или вам жарко.",
 r:["Избегайте слишком острой, перегревающей пищи (например, имбирного чая).","Следите за тем, чтобы не перегреваться и не доводить себя до сильного голода: в этом состоянии дисбаланс Питты усиливается."]},
{n:"Капха",c:"--k",
 d:"В последние 2–3 года у вас преобладают качества Капхи: тяжесть, плотность, влажность, прохлада, медлительность. Тело склонно к набору веса, застойным явлениям и отёкам, а психика к грусти, привязчивости и долгому переживанию обид.",
 r:["Не усердствуйте с маслянистой и тяжёлой пищей и молочными продуктами.","Вам хорошо подходят сырые овощи и лёгкая пища."]}
];
var O=[
["Основное масло: кунжутное (согревающее, тяжёлое). Также подходят миндальное и авокадо.","Частота: Вате рекомендуют промасливание ежедневно.","При очень сухой коже иногда добавляют немного касторового масла."],
["Основное масло: кокосовое (охлаждающее). Также подходят нерафинированное подсолнечное и гхи.","Частота: 2–3 раза в неделю.","Кунжутное масло согревающее, поэтому при выраженной Питте его обычно не рекомендуют или заменяют кокосовым."],
["Подходят согревающие масла: горчичное, кукурузное, кунжутное. В части источников также миндальное и льняное.","Частота: достаточно двух раз в неделю.","Несмотря на потливость, Капхе нужно тепло, поэтому масло лучше подогреть."]
];
var OG=["Подогрейте масло: оно должно быть тёплым, но не горячим.","Лучше делать утром после пробуждения, в тёплом помещении без сквозняков.","Не реже раза в неделю уделяйте отдельное время голове и стопам.","Масло подбирайте по текущему состоянию дош (Викрити), как показывает этот тест, и учитывайте сезон: в сильную жару избегайте «горячих» масел, в холод осторожнее с охлаждающими."];
var st={i:-1,a:[],res:false},app=document.getElementById("app");
try{var s=JSON.parse(localStorage.getItem("dosha_v1")||"null");if(s&&s.a&&s.a.length===Q.length){st=s}}catch(e){}
function save(){try{localStorage.setItem("dosha_v1",JSON.stringify(st))}catch(e){}}
function cnt(){return st.a.filter(function(x){return x===0||x===1||x===2}).length}
function render(){
 if(st.res)return result();
 if(st.i<0)return intro();
 var q=Q[st.i],a=st.a[st.i],h="";
 h+='<div class="mu">Вопрос '+(st.i+1)+' из '+Q.length+'</div><div class="bar"><i style="width:'+((st.i+1)/Q.length*100)+'%"></i></div>';
 h+='<div class="card"><h2 style="margin-top:0">'+q[0]+'</h2>';
 if(st.i===0)h+='<p class="mu">Вспомните, какими вы были последние 2–3 года. Не 10 лет назад и не такими, какими хотели бы быть.</p>';
 for(var k=1;k<=3;k++)h+='<button class="opt'+(a===k-1?' on':'')+'" onclick="pick('+(k-1)+')">'+q[k]+'</button>';
 h+='<p class="mu">Если ни один вариант не подходит, нажмите «Пропустить».</p></div>';
 h+='<div class="nav"><button class="sec" onclick="go(-1)">← Назад</button><span>';
 h+='<button class="sec" onclick="go(1)">Пропустить</button> ';
 if(st.i===Q.length-1)h+='<button onclick="finish()">Результат</button>';
 h+='</span></div>';
 app.innerHTML=h;
}
function intro(){
 var p=cnt();
 app.innerHTML='<h1>Определение дошевой конституции</h1><div class="card"><p>Тест построен по методике Бориса Рагозина (Аюрведа). Он состоит из '+Q.length+' вопросов. В каждом три варианта: для Ваты, Питты и Капхи.</p><ul><li>Отвечайте о том, как вы живёте <b>последние 2–3 года</b>.</li><li>В каждой строке выберите <b>только один</b> вариант.</li><li>Если ни один не подходит, пропустите вопрос.</li></ul><p class="mu">Важно: такая форма определяет не изначальную конституцию (Пракрити), а текущее состояние (Викрити).</p>'+(p?'<p>Сохранён прогресс: отвечено '+p+' из '+Q.length+'.</p>':'')+'<button onclick="start()">'+(p?'Продолжить':'Начать')+'</button> '+(p?'<button class="sec" onclick="reset()">Начать заново</button>':'')+'</div>';
}
function start(){st.i=0;if(st.a.length!==Q.length)st.a=Q.map(function(){return null});save();render()}
function pick(v){st.a[st.i]=v;save();if(st.i<Q.length-1){st.i++}render();window.scrollTo(0,0)}
function go(d){var n=st.i+d;if(n<0){st.i=-1}else if(n>=Q.length){finish();return}else st.i=n;save();render();window.scrollTo(0,0)}
function reset(){st={i:0,a:Q.map(function(){return null}),res:false};save();render();window.scrollTo(0,0)}
function finish(){if(cnt()<18){alert("Для достоверного результата ответьте хотя бы на 18 вопросов. Сейчас отвечено: "+cnt()+".");return}st.res=true;save();render();window.scrollTo(0,0)}
function result(){
 var c=[0,0,0];st.a.forEach(function(x){if(x!==null&&x>=0)c[x]++});
 var n=c[0]+c[1]+c[2],pc=c.map(function(x){return Math.round(x/n*100)});
 var o=[0,1,2].sort(function(a,b){return c[b]-c[a]});
 var gap=pc[o[0]]-pc[o[1]],gap2=pc[o[0]]-pc[o[2]],t;
 if(gap>=10){t="Преобладает одна доша: "+D[o[0]].n;}
 else if(gap2>=10){t="Смешанный тип: "+D[o[0]].n+" и "+D[o[1]].n}
 else{t="Все три доши выражены примерно одинаково"}
 var h='<h1>Ваш результат</h1><div class="card"><div class="mu">Текущее состояние (Викрити) за последние 2–3 года. Учтено ответов: '+n+' из '+Q.length+'.</div>';
 [0,1,2].forEach(function(i){h+='<div class="row"><b><span>'+D[i].n+'</span><span>'+c[i]+' ('+pc[i]+'%)</span></b><div class="track"><i style="width:'+pc[i]+'%;background:var('+D[i].c+')"></i></div></div>'});
 h+='<h2>'+t+'</h2>';
 var show=gap>=10?[o[0]]:(gap2>=10?[o[0],o[1]]:[0,1,2]);
 show.forEach(function(i){h+='<h2 style="color:var('+D[i].c+')">'+D[i].n+'</h2><p>'+D[i].d+'</p><b>Рекомендации:</b><ul>'+D[i].r.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul><b>Масло для абхьянги (масляного самомассажа):</b><ul>'+O[i].map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul>'});
 h+='<h2>Общие советы по абхьянге</h2><ul>'+OG.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul><p class="mu">Рекомендации по маслу для абхьянги взяты из общих аюрведических источников, а не из видео доктора Рагозина. В разных традициях они могут отличаться.</p>';
 if(show.length>1)h+='<p class="mu">Когда доши выражены близко, учитывайте рекомендации для каждой из них и ориентируйтесь на самочувствие.</p>';
 h+='</div><div class="note"><b>Как читать результат.</b> Доши у каждого человека всегда смешаны: в вас есть и Вата, и Питта, и Капха, поэтому нормально, когда набраны баллы во всех столбцах. Цифры показывают, к дисбалансу какого типа склонно тело сейчас, и это состояние можно менять питанием, образом жизни, специями и йогой, в лучшую или худшую сторону. Изначальную конституцию (Пракрити) по такой анкете определить нельзя. Доктор Рагозин определяет её по пульсу на очном приёме.</div>';
 h+='<div class="note">Тест носит образовательный характер и не заменяет консультацию врача.</div><div class="nav"><button class="sec" onclick="back()">← К ответам</button><button class="sec" onclick="reset()">Пройти заново</button></div>';
 app.innerHTML=h;
}
function back(){st.res=false;st.i=Q.length-1;save();render()}
render();
</script>
</body>
</html>
